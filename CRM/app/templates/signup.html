{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div
        style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; color: #0A192F; margin-bottom: 10px;">Create Account</h2>
        <p style="text-align: center; color: #6B7280; margin-bottom: 30px;">Join WordbitX CRM today.</p>

        <form action="/signup" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: #1F2937; font-weight: 500;">Full Name</label>
                <input type="text" name="name" required
                    style="width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 6px; outline: none;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: #1F2937; font-weight: 500;">Email
                    Address</label>
                <input type="email" name="email" required
                    style="width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 6px; outline: none;">
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; color: #1F2937; font-weight: 500;">Password</label>
                <input type="password" name="password" required
                    style="width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 6px; outline: none;">
            </div>

            <!-- Button with forced visibility and direct color codes -->
            <button type="submit"
                style="display: block; width: 100%; background-color: #0A192F; color: white; padding: 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; margin-top: 10px; visibility: visible; opacity: 1;">
                Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 25px; color: #6B7280; font-size: 14px;">
            Already have an account? <a href="{{ url_for('main.login') }}"
                style="color: #0A192F; font-weight: bold; text-decoration: none;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
