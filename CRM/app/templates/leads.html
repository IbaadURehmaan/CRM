{% extends "base.html" %}

{% block content %}
<!-- Modal Styling -->
<style>
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 25, 47, 0.6);
        /* Navy blue transparent background */
        z-index: 1001;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s;
    }

    .modal-content {
        background: var(--white);
        padding: 30px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
        from {
            transform: translateY(-20px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-header h2 {
        color: var(--navy);
        font-size: 20px;
    }

    .close-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: var(--text-light);
        transition: color 0.2s;
    }

    .close-btn:hover {
        color: #EF4444;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: var(--text-dark);
        font-weight: 500;
        font-size: 14px;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #D1D5DB;
        border-radius: 6px;
        outline: none;
        transition: border 0.3s;
    }

    .form-group input:focus {
        border-color: var(--green);
    }

    .submit-btn {
        background: var(--green);
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.3s;
    }

    .submit-btn:hover {
        background: var(--green-hover);
    }
</style>

<div
    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #E5E7EB;">
    <div>
        <h1 style="font-size: 28px; color: var(--navy);">Leads</h1>
        <p style="color: var(--text-light); margin-top: 5px;">Manage and contact your potential clients.</p>
    </div>
    <!-- Button ab modal ko open karega -->
    <button onclick="document.getElementById('leadModal').style.display='flex'"
        style="background: var(--navy); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; box-shadow: var(--shadow);"
        onmouseover="this.style.background='var(--green)'" onmouseout="this.style.background='var(--navy)'">
        <i class="fas fa-plus" style="margin-right: 8px;"></i> Add New Lead
    </button>
</div>

<div style="background: white; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead style="background: #F9FAFB; border-bottom: 2px solid #E5E7EB;">
            <tr>
                <th style="padding: 16px 24px; color: var(--text-light); font-weight: 600; font-size: 14px;">Name</th>
                <th style="padding: 16px 24px; color: var(--text-light); font-weight: 600; font-size: 14px;">Email
                    Address</th>
                <th style="padding: 16px 24px; color: var(--text-light); font-weight: 600; font-size: 14px;">Status</th>
                <th
                    style="padding: 16px 24px; color: var(--text-light); font-weight: 600; font-size: 14px; text-align: right;">
                    Action</th>
            </tr>
        </thead>
        <tbody>
            {% for lead in leads %}
            <tr style="border-bottom: 1px solid #E5E7EB; transition: background 0.2s;"
                onmouseover="this.style.background='#F3F4F6'" onmouseout="this.style.background='transparent'">
                <td style="padding: 16px 24px; font-weight: bold; color: var(--navy);">{{ lead.name }}</td>
                <td style="padding: 16px 24px; color: var(--text-light);">{{ lead.email }}</td>
                <td style="padding: 16px 24px;">
                    <span
                        style="background: rgba(16, 185, 129, 0.1); color: var(--green); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">New
                        Lead</span>
                </td>
                <td style="padding: 16px 24px; text-align: right;">
                    <a href="mailto:{{ lead.email }}"
                        style="background: var(--green); color: white; padding: 8px 16px; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; transition: all 0.2s ease; display: inline-block; box-shadow: 0 2px 4px rgba(16,185,129,0.2);"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 10px rgba(16,185,129,0.3)'"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 4px rgba(16,185,129,0.2)'">
                        <i class="fas fa-envelope" style="margin-right: 5px;"></i> Email
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="padding: 40px; text-align: center; color: var(--text-light); font-size: 15px;">
                    <i class="fas fa-folder-open"
                        style="font-size: 30px; margin-bottom: 10px; color: #D1D5DB; display: block;"></i>
                    No leads found in the database.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add New Lead Pop-up Modal -->
<div id="leadModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Lead</h2>
            <!-- Close Button -->
            <button class="close-btn" onclick="document.getElementById('leadModal').style.display='none'"><i
                    class="fas fa-times"></i></button>
        </div>

        <!-- Yeh form data backend par bheje ga -->
        <form action="/add_lead" method="POST">
            <div class="form-group">
                <label>Lead Full Name</label>
                <input type="text" name="name" placeholder="e.g. Ali Khan" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="ali@example.com" required>
            </div>
            <button type="submit" class="submit-btn">Save Lead</button>
        </form>
    </div>
</div>

<!-- Modal ko bahar click karne se band karne ka script -->
<script>
    window.onclick = function (event) {
        var modal = document.getElementById('leadModal');
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>
{% endblock %}
